<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'">
<title>ArtNote</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header id="bar">
  <div class="group" id="tools">
    <button data-tool="move" title="Вибрати й перемістити (V)"><svg viewBox="0 0 24 24"><path d="M6 3l13 7.5-5.5 1.5L11 17.5z"/></svg></button>
    <button data-tool="pen" title="Пензель (B)"><svg viewBox="0 0 24 24"><path d="M14.5 5.5l4 4L9 19l-5 1 1-5z"/><path d="M12.5 7.5l4 4"/></svg></button>
    <button data-tool="arrow" title="Стрілка (A) · Shift — кут 45°"><svg viewBox="0 0 24 24"><path d="M5 19L18 6"/><path d="M9.5 5H19v9.5"/></svg></button>
    <button data-tool="rect" title="Рамка (R) · Shift — квадрат"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/></svg></button>
    <button data-tool="ellipse" title="Овал (E) · Shift — коло"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg></button>
    <button data-tool="text" title="Текст (T)"><svg viewBox="0 0 24 24"><path d="M5 7V5h14v2"/><path d="M12 5v14"/><path d="M9 19h6"/></svg></button>
    <button data-tool="pin" title="Пін-коментар (C)"><svg viewBox="0 0 24 24"><path d="M5 4.5h14a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5h-8l-4.5 3.5v-3.5H5A1.5 1.5 0 0 1 3.5 15V6A1.5 1.5 0 0 1 5 4.5z"/><path d="M11 9l1.5-1v5"/></svg></button>
  </div>
  <div class="sep"></div>
  <div class="group" id="colors"></div>
  <div class="sep"></div>
  <div class="group" id="sizes">
    <button data-size="0" title="Тонко ([ ])"><i style="width:5px;height:5px"></i></button>
    <button data-size="1" title="Середньо ([ ])"><i style="width:8px;height:8px"></i></button>
    <button data-size="2" title="Товсто ([ ])"><i style="width:12px;height:12px"></i></button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button id="undo" title="Скасувати (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button id="redo" title="Повторити (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  </div>
  <div class="spacer"></div>
  <button id="copy" class="ghost" title="Буфер і так оновлюється сам; скопіювати ще раз (Ctrl+C)">Копіювати</button>
  <button id="done" class="primary" title="Зберегти, скопіювати й закрити">Готово<kbd>Enter</kbd></button>
</header>

<main>
  <section id="stage">
    <div id="frame">
      <canvas id="cv"></canvas>
      <div id="layer"></div>
    </div>
  </section>
  <aside id="side">
    <h2>Коментарі</h2>
    <ol id="pins"></ol>
    <p id="empty">Натисни <kbd>C</kbd> і клікни по картинці: з'явиться номер, поруч напиши правку. Коментарі підуть легендою під картинку.</p>
  </aside>
</main>

<footer id="status">
  <span id="synced" title="Картинка з розміткою вже в буфері обміну й оновлюється з кожною зміною">✓ у буфері</span>
  <span><kbd>C</kbd>пін</span>
  <span><kbd>A</kbd>стрілка</span>
  <span><kbd>B</kbd>пензель</span>
  <span><kbd>R</kbd><kbd>E</kbd>рамка, овал</span>
  <span><kbd>T</kbd>текст</span>
  <span><kbd>V</kbd>рух, <kbd>Del</kbd></span>
  <span><kbd>1</kbd>–<kbd>4</kbd>колір</span>
  <span><kbd>Enter</kbd>готово</span>
  <span><kbd>Esc</kbd>закрити</span>
</footer>

<div id="toast"></div>
<script src="editor.js"></script>
</body>
</html>
