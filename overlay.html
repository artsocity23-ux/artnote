<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'">
<title>ArtNote</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    cursor: crosshair;
    user-select: none;
  }
  #shot { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #dim { position: fixed; inset: 0; background: rgba(0, 0, 0, .28); }
  #sel {
    position: fixed;
    display: none;
    outline: 1px solid rgba(255, 255, 255, .95);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .55), 0 0 0 100000px rgba(0, 0, 0, .45);
  }
  #size {
    position: absolute;
    left: 0;
    top: -27px;
    padding: 5px 7px;
    border-radius: 5px;
    background: rgba(20, 22, 28, .88);
    color: #fff;
    font: 600 12px/1 "Segoe UI", sans-serif;
    white-space: nowrap;
  }
  #hint {
    position: fixed;
    left: 50%;
    top: 22px;
    transform: translateX(-50%);
    padding: 9px 14px;
    border-radius: 8px;
    background: rgba(20, 22, 28, .9);
    color: #e7e9ee;
    font: 13px/1 "Segoe UI", sans-serif;
    white-space: nowrap;
    pointer-events: none;
  }
  kbd {
    font: 600 11px/1 "Segoe UI", sans-serif;
    padding: 3px 5px;
    margin: 0 3px 0 8px;
    border-radius: 4px;
    background: rgba(255, 255, 255, .14);
  }
  body.dragging #dim, body.dragging #hint { display: none; }
</style>
</head>
<body>
<img id="shot" alt="">
<div id="dim"></div>
<div id="sel"><span id="size"></span></div>
<div id="hint">Виділи область<kbd>Enter</kbd>весь екран<kbd>Esc</kbd>скасувати</div>
<script src="overlay.js"></script>
</body>
</html>
