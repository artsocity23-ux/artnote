<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>ArtNote demo</title>
<!-- Props for demo.js: #poster is the picture that gets marked up, #chat is a plain chat to paste the result into. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  body:not(.poster) #poster, body:not(.chat) #chat { display: none; }

  #poster { position: relative; width: 1200px; height: 700px; overflow: hidden;
    background: linear-gradient(#070b1d 0%, #10183a 45%, #23305a 75%, #3a4670 100%); }
  #poster svg { position: absolute; inset: 0; }
  .title { position: absolute; left: 72px; bottom: 92px; color: #f4efe2; letter-spacing: .06em; }
  .title h1 { font: 800 64px/1 'Segoe UI', sans-serif; }
  .title p { margin-top: 14px; font: 500 20px 'Segoe UI', sans-serif; color: #b9c3dc; letter-spacing: .12em; }

  #chat { display: flex; flex-direction: column; height: 100vh; background: #17191f; color: #e8eaf0; }
  #chat header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: #1e2128; border-bottom: 1px solid #2a2e37; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: #3a6df0; display: grid; place-items: center; font-weight: 700; }
  #chat header b { display: block; font-size: 15px; }
  #chat header small { color: #8b93a5; font-size: 12px; }
  #log { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 18px 22px; }
  .msg { max-width: 64%; padding: 9px 13px; border-radius: 14px; font-size: 15px; line-height: 1.35; background: #262a33; align-self: flex-start; }
  .msg.me { align-self: flex-end; background: #2f5bd3; }
  .msg.pic { padding: 5px; background: #2f5bd3; }
  .msg.pic img { display: block; max-width: 100%; max-height: 330px; border-radius: 10px; }
  #input { margin: 0 18px 16px; padding: 12px 16px; border-radius: 12px; background: #23262e; border: 1px solid #2f333d; color: #8b93a5; font-size: 15px; outline: none; caret-color: transparent; }
</style>
</head>
<body>
<section id="poster">
  <svg viewBox="0 0 1200 700" preserveAspectRatio="none">
    <defs>
      <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
      <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
      <linearGradient id="aur" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5dffb0" stop-opacity="0"/><stop offset=".55" stop-color="#3ff2a8" stop-opacity=".55"/><stop offset="1" stop-color="#1fb6c9" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <g id="stars" fill="#fff"></g>
    <g filter="url(#blur)">
      <path d="M120 250 C 330 110, 520 300, 760 150 S 1080 120, 1180 210 L 1180 300 C 1020 230, 880 300, 720 260 S 360 330, 120 330 Z" fill="url(#aur)"/>
      <path d="M260 190 C 420 90, 600 210, 820 90 L 840 170 C 640 260, 450 170, 280 260 Z" fill="#7bffcf" opacity=".28"/>
    </g>
    <circle cx="1010" cy="118" r="70" fill="#f6efd6" opacity=".25" filter="url(#glow)"/>
    <circle cx="1010" cy="118" r="42" fill="#f6efd6"/>
    <path d="M0 470 L130 380 L230 440 L360 330 L470 420 L590 350 L720 440 L860 360 L1000 430 L1110 380 L1200 420 L1200 700 L0 700 Z" fill="#1a2446"/>
    <path d="M0 540 L170 470 L330 520 L520 450 L700 520 L880 470 L1040 520 L1200 480 L1200 700 L0 700 Z" fill="#121a35"/>
    <path d="M0 620 C 300 560, 600 600, 1200 560 L1200 700 L0 700 Z" fill="#0b1124"/>
    <circle cx="858" cy="492" r="40" fill="#ffb347" opacity=".45" filter="url(#glow)"/>
    <path d="M808 528 L808 488 L850 456 L892 488 L892 528 Z" fill="#0b1124"/>
    <rect x="842" y="494" width="18" height="16" fill="#ffc46b"/>
  </svg>
  <div class="title"><h1>ПІВНІЧНЕ СЯЙВО</h1><p>ФЕСТИВАЛЬ СВІТЛА · КАРПАТИ</p></div>
</section>

<section id="chat">
  <header><div class="avatar">А</div><div><b>Арт-директор</b><small>у мережі</small></div></header>
  <div id="log"><div class="msg">Скинь, що поправити на постері</div></div>
  <div id="input" contenteditable="true">Повідомлення…</div>
</section>

<script>
  document.body.className = location.hash.slice(1);
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 140; i++) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    s.setAttribute('cx', rnd() * 1200);
    s.setAttribute('cy', rnd() * 380);
    s.setAttribute('r', 0.6 + rnd() * 1.3);
    s.setAttribute('opacity', 0.35 + rnd() * 0.6);
    document.getElementById('stars').append(s);
  }

  const log = document.getElementById('log');
  const say = (text, cls) => { const m = document.createElement('div'); m.className = `msg ${cls}`; m.textContent = text; log.append(m); };
  document.addEventListener('paste', e => {
    e.preventDefault();
    const file = [...e.clipboardData.items].find(i => i.type.startsWith('image/'))?.getAsFile();
    if (!file) return;
    const m = document.createElement('div');
    m.className = 'msg me pic';
    m.innerHTML = '<img>';
    m.firstChild.src = URL.createObjectURL(file);
    log.append(m);
    document.getElementById('input').textContent = 'Повідомлення…';
    setTimeout(() => say('Бачу всі три, правлю 👍', ''), 1400);
  });
</script>
</body>
</html>
